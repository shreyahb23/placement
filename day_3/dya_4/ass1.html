<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Tax Dashboard</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: linear-gradient(to right, #dbeafe, #eff6ff);
    padding: 30px;
}

/* TITLE */
h1 {
    text-align: center;
    color: #1e3a8a;
    margin-bottom: 10px;
    font-size: 42px;
}

.subtitle {
    text-align: center;
    color: #555;
    margin-bottom: 35px;
    font-size: 18px;
}

/* PRODUCT BUTTONS */
.products {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 40px;
}

.products button {
    padding: 14px 28px;
    border: 2px solid #2563eb;
    background: white;
    color: #2563eb;
    border-radius: 40px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

/*  Active button stays highlighted */
.products button.active,
.products button:hover {
    background: #2563eb;
    color: white;
    transform: scale(1.08);
    box-shadow: 0 8px 20px rgba(37,99,235,0.4);
}

/* SUMMARY BOXES */
.summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: 0.4s;
}

.box:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
}

.box p {
    color: gray;
    font-size: 16px;
}

.box h2 {
    margin-top: 12px;
    font-size: 36px;
    color: #2563eb;
}

/*  Your country label style */
.box .you-label {
    font-size: 12px;
    background: #2563eb;
    color: white;
    padding: 3px 10px;
    border-radius: 20px;
    display: inline-block;
    margin-top: 6px;
}

/* COUNTRY CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 25px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    border-top: 6px solid #2563eb;
    transition: 0.4s;
    cursor: pointer;
    animation: fadeIn 0.5s ease;
}

/* Your country card highlighted differently */
.card.my-country {
    border-top: 6px solid #16a34a;
    background: #f0fdf4;
}

.card:hover {
    transform: translateY(-10px) scale(1.03);
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}

/*  Flag + name headline */
.card h2 {
    font-size: 32px;
    margin-bottom: 6px;
    color: #1e3a8a;
}

.card p {
    margin: 8px 0;
    color: #555;
    font-size: 16px;
}

.tax {
    color: #16a34a;
    font-weight: bold;
}

.total {
    color: #2563eb;
    font-weight: bold;
}

/* Your country badge inside card */
.you-badge {
    display: inline-block;
    background: #16a34a;
    color: white;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

</style>
</head>
<body>

<h1>🌍 Global Tax Dashboard</h1>
<p class="subtitle">Interactive Tax Calculation Across 10 Countries</p>

<!-- PRODUCT BUTTONS -->
<div class="products">
    <button onclick="showTax(this, 1000)">💻 Laptop</button>
    <button onclick="showTax(this, 700)">📱 Smartphone</button>
    <button onclick="showTax(this, 200)">🎧 Headphones</button>
    <button onclick="showTax(this, 300)">⌚ Smart Watch</button>
    <button onclick="showTax(this, 900)">📷 Camera</button>
</div>

<!-- SUMMARY — Clearly labeled as India (Your Country) -->
<div class="summary">

    <div class="box">
        <p>Base Price</p>
        <h2 id="basePrice">$0</h2>
    </div>

    <div class="box">
        <p>India's Tax Amount</p>
        <h2 id="indiaTax">$0</h2>
        <span class="you-label">Your Country</span>
    </div>

    <div class="box">
        <p>India Pays Total</p>
        <h2 id="indiaTotal">$0</h2>
        <span class="you-label">Your Country</span>
    </div>

    <div class="box">
        <p>Total Countries</p>
        <h2>10</h2>
    </div>

</div>

<!-- COUNTRY CARDS -->
<div class="cards" id="cards"></div>

<script>

// Added flag to each country
const countries = [
    { name: "India",     flag: "🇮🇳", tax: 18 },
    { name: "USA",       flag: "🇺🇸", tax: 8  },
    { name: "UK",        flag: "🇬🇧", tax: 20 },
    { name: "Germany",   flag: "🇩🇪", tax: 19 },
    { name: "Australia", flag: "🇦🇺", tax: 10 },
    { name: "Canada",    flag: "🇨🇦", tax: 5  },
    { name: "France",    flag: "🇫🇷", tax: 20 },
    { name: "Japan",     flag: "🇯🇵", tax: 10 },
    { name: "UAE",       flag: "🇦🇪", tax: 5  },
    { name: "Singapore", flag: "🇸🇬", tax: 9  }
];

function showTax(clickedBtn, price) {

    //  Remove active from all buttons, add to clicked one
    document.querySelectorAll(".products button")
        .forEach(btn => btn.classList.remove("active"));
    clickedBtn.classList.add("active");

    // SUMMARY — India is index 0
    let indiaTax   = (price * 18) / 100;
    let indiaTotal = price + indiaTax;

    document.getElementById("basePrice").innerHTML  = "$" + price;
    document.getElementById("indiaTax").innerHTML   = "$" + indiaTax;
    document.getElementById("indiaTotal").innerHTML = "$" + indiaTotal;

    // COUNTRY CARDS
    let output = "";

    countries.forEach(function(country) {

        let taxAmount = (price * country.tax) / 100;
        let total     = price + taxAmount;

        // India gets a special green card + "Your Country" badge
        let isIndia   = country.name === "India";
        let cardClass = isIndia ? "card my-country" : "card";
        let badge     = isIndia ? '<div class="you-badge">✅ Your Country</div>' : "";

        output += `
        <div class="${cardClass}">
            ${badge}
            <h2>${country.flag} ${country.name}</h2>
            <p>Tax Rate : ${country.tax}%</p>
            <p class="tax">Tax on Item : $${taxAmount}</p>
            <p class="total">Total Price : $${total}</p>
        </div>
        `;

    });

    document.getElementById("cards").innerHTML = output;
}

//  Default load = Laptop button active on page open
window.onload = function() {
    const laptopBtn = document.querySelector(".products button");
    showTax(laptopBtn, 1000);
};

</script>
</body>
</html>
